<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colour Vision Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <div class="logo">Colour Vision Study</div>

            <a href="index.html">← Home</a>
        </nav>
    </header>


    <main>

        <section class="test-page">

            <p class="small-title">
                COLOUR VISION TEST
            </p>

            <h1 id="question-number">
                Question 1
            </h1>

            <p id="instruction">
                Look carefully at the image and select the answer you see.
            </p>


            <!-- TEST IMAGE WILL GO HERE -->

          <div id="colour-grid" class="colour-grid">
</div>

            </div>


           <div class="answers">

    <button onclick="answer(0)">1</button>
    <button onclick="answer(1)">2</button>
    <button onclick="answer(2)">3</button>
    <button onclick="answer(3)">4</button>
    <button onclick="answer(4)">5</button>
    <button onclick="answer(5)">6</button>

</div>


            <p id="progress">
                Question 1 of 10
            </p>

        </section>

    </main>


<script>

const questions = [

    {
        base: "#3A9D8F",
        different: "#3A9B8F",
        position: 2
    },

    {
        base: "#3A9D8F",
        different: "#3A998F",
        position: 4
    },

    {
        base: "#3A9D8F",
        different: "#3A958F",
        position: 1
    },

    {
        base: "#3A9D8F",
        different: "#3A918F",
        position: 5
    },

    {
        base: "#3A9D8F",
        different: "#3A8D8F",
        position: 3
    }

];


let question = 0;
let score = 0;


function showQuestion() {

    document.getElementById("question-number").innerText =
        "Question " + (question + 1);

    document.getElementById("progress").innerText =
        "Question " + (question + 1) + " of " + questions.length;


    const grid = document.getElementById("colour-grid");

    grid.innerHTML = "";


    const current = questions[question];


    for (let i = 0; i < 6; i++) {

        const circle = document.createElement("div");

        circle.className = "colour-circle-test";

        if (i === current.position) {

            circle.style.backgroundColor =
                current.different;

        } else {

            circle.style.backgroundColor =
                current.base;

        }

        grid.appendChild(circle);

    }

}


function answer(choice) {

    const current = questions[question];


    if (choice === current.position) {

        score++;

    }


    question++;


    if (question >= questions.length) {

        document.getElementById("colour-grid").innerHTML = "";

        document.getElementById("instruction").innerText =
            "Test complete!";

        document.getElementById("question-number").innerText =
            "Your score: " + score + "/" + questions.length;

        document.querySelector(".answers").innerHTML = "";

        document.getElementById("progress").innerText =
            "Well done!";

        return;

    }


    showQuestion();

}


showQuestion();

</script>
</body>

</html>
